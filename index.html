<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>emejota — art & objects</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f5ef;
      color: #24231f;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #d9d6cd;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    header a {
      color: inherit;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero {
      min-height: 72vh;
      padding: 80px 8%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(58px, 12vw, 150px);
      line-height: .88;
      letter-spacing: -0.09em;
      margin: 28px 0;
      max-width: 900px;
    }

    .intro {
      font-size: 17px;
      line-height: 1.6;
      max-width: 430px;
      color: #625f57;
    }

    .shop-link {
      margin-top: 28px;
      padding: 14px 22px;
      background: #24231f;
      color: #f7f5ef;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .bottom {
      border-top: 1px solid #d9d6cd;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 11px;
      color: #625f57;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .hero { min-height: 68vh; padding: 55px 7%; }
      header { padding: 20px 7%; }
      .intro { font-size: 15px; }
      .bottom { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">emejota®</div>
    <a href="mailto:hola@emejota.com">contacto ↗</a>
  </header>

  <main class="hero">
    <p class="eyebrow">arte · imágenes · objetos</p>
    <h1>Art for<br>your walls<br>& your world.</h1>
    <p class="intro">
      Una colección de imágenes intervenidas, prints, collages y piezas
      hechas para vivir fuera de una pantalla.
    </p>
    <a class="shop-link" href="mailto:hola@emejota.com?subject=Quiero%20ver%20la%20coleccion">
      explorar la colección ↗
    </a>
  </main>

  <footer class="bottom">
    <span>emejota © 2026</span>
    <span>curated & altered by emejota</span>
    <span>Santiago, República Dominicana</span>
  </footer>
</body>
</html>
