
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="description" content="EMEJOTA — Your local dealer.">
  <title>EMEJOTA® — Your local dealer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f5f2eb;
      --ink: #171714;
      --red: #ed432f;
      --line: rgba(23,23,20,.22);
      --muted: #77766f;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    /* Small, discreet top navigation */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 17px 4%;
      border-bottom: 1px solid var(--line);
      font: 10px "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .025em;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.2vw, 30px);
    }

    .nav a { transition: color .2s; }
    .nav a:hover { color: var(--red); }

    /* Repeating EMEJOTA marquee */
    .marquee {
      overflow: hidden;
      width: 100%;
      padding: 34px 0 25px;
      border-bottom: 1px solid var(--line);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: roll 32s linear infinite;
      will-change: transform;
    }

    .marquee:hover .marquee-track {
      animation-play-state: paused;
    }

    .marquee-group {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .marquee-word {
      display: flex;
      align-items: flex-start;
      padding-right: .16em;
      font-size: clamp(66px, 12.8vw, 180px);
      line-height: .88;
      font-weight: 700;
      letter-spacing: -.095em;
      white-space: nowrap;
    }

    .marquee-word sup {
      font: 11px "DM Mono", monospace;
      letter-spacing: 0;
      margin: .15em 0 0 .3em;
    }

    .marquee-dot {
      color: var(--red);
      padding: 0 .16em 0 .12em;
      font-size: .7em;
    }

    @keyframes roll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .tagline {
      padding: 10px 4% 26px;
      text-align: center;
      font: 10px "DM Mono", monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-head {
      padding: 26px 4% 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .section-head h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 42px);
      font-weight: 500;
      letter-spacing: -.065em;
    }

    .count {
      font: 10px "DM Mono", monospace;
      text-transform: uppercase;
      color: var(--muted);
    }

    .filters {
      padding: 0 4% 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 9px 13px;
      border-radius: 100px;
      font: 10px "DM Mono", monospace;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter.active, .filter:hover {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .gallery {
      padding: 0 4% 70px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 34px 16px;
    }

    .product { min-width: 0; }

    .product-image {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #e8e3d9;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .45s ease;
    }

    .product:hover .product-image img { transform: scale(1.035); }

    .product-number {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 8px;
      background: var(--paper);
      font: 9px "DM Mono", monospace;
    }

    .product-info {
      padding-top: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .product-title {
      font-size: 16px;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }

    .product-category {
      margin-top: 5px;
      color: var(--muted);
      font: 10px "DM Mono", monospace;
      text-transform: uppercase;
    }

    .product-price {
      font: 11px "DM Mono", monospace;
      white-space: nowrap;
    }

    .state {
      grid-column: 1 / -1;
      min-height: 170px;
      padding: 35px 20px;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
    }

    .state strong {
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: -.05em;
    }

    .state p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 18px 4%;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font: 10px "DM Mono", monospace;
      text-transform: uppercase;
    }

    @media (max-width: 650px) {
      .nav {
        padding: 15px 4%;
        gap: 10px;
        font-size: 9px;
      }

      .nav-group { gap: 11px; }

      .marquee { padding: 32px 0 23px; }

      .marquee-word {
        font-size: clamp(62px, 13vw, 90px);
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 25px 11px;
      }

      .product-title { font-size: 14px; }
      .product-price { font-size: 10px; }
    }

    @media (max-width: 380px) {
      .nav { font-size: 8px; }
      .nav-group { gap: 8px; }
      .gallery { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee-track { animation: none; }
      html { scroll-behavior: auto; }
      .product-image img { transition: none; }
    }
  </style>
</head>

<body>
  <header class="nav">
    <nav class="nav-group" aria-label="Art navigation">
      <a href="#all-art">All Art</a>
      <a href="#collections">Collections</a>
    </nav>
    <nav class="nav-group" aria-label="Studio navigation">
      <a href="#about">About</a>
      <a href="mailto:hello@emejota.com">Contact</a>
      <a href="#cart" id="cart-link">Cart (0)</a>
    </nav>
  </header>

  <main>
    <section aria-label="EMEJOTA identity">
      <div class="marquee" aria-label="EMEJOTA">
        <div class="marquee-track">
          <div class="marquee-group" aria-hidden="true">
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
          </div>
          <div class="marquee-group" aria-hidden="true">
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
            <span class="marquee-word">EMEJOTA<sup>®</sup><span class="marquee-dot">✳</span></span>
          </div>
        </div>
      </div>
      <div class="tagline">Your local dealer</div>
    </section>

    <section id="all-art">
      <div class="section-head">
        <h1>All Art</h1>
        <span class="count" id="work-count">Loading works</span>
      </div>

      <div class="filters" aria-label="Filter works by category">
        <button class="filter active" data-category="all">All</button>
        <button class="filter" data-category="prints">Prints</button>
        <button class="filter" data-category="paintings">Paintings</button>
        <button class="filter" data-category="objects">Objects</button>
      </div>

      <div class="gallery" id="gallery" aria-live="polite">
        <div class="state">
          <strong>Loading…</strong>
          <p>Getting the works from the studio.</p>
        </div>
      </div>
    </section>

    <section id="collections" hidden></section>
    <section id="about" hidden></section>
    <section id="cart" hidden></section>
  </main>

  <footer>
    <span>EMEJOTA®</span>
    <span>Your local dealer</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hdehwxlwvafnbthosabl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vbdPL00ZnIYMrHXQlVAvrg_KupjLMrc";

    const gallery = document.getElementById("gallery");
    const workCount = document.getElementById("work-count");
    let allProducts = [];
    let activeCategory = "all";

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function formatPrice(price) {
      return new Intl.NumberFormat("es-DO", {
        style: "currency",
        currency: "DOP",
        maximumFractionDigits: 2
      }).format(Number(price) || 0);
    }

    function renderProduct(product, index) {
      const title = escapeHTML(product.title || "Untitled work");
      const category = escapeHTML(product.category || "Art & objects");
      let imageURL = "";

      try {
        const parsed = new URL(String(product.image_url || ""));
        if (["https:", "http:"].includes(parsed.protocol)) imageURL = parsed.href;
      } catch (_) {}

      const image = imageURL
        ? `<img src="${escapeHTML(imageURL)}" alt="${title}" loading="lazy">`
        : `<div style="height:100%;display:grid;place-items:center;font:10px 'DM Mono',monospace;color:#77766f">IMAGE COMING SOON</div>`;

      return `
        <article class="product">
          <div class="product-image">
            ${image}
            <span class="product-number">EJ — ${String(index + 1).padStart(3, "0")}</span>
          </div>
          <div class="product-info">
            <div>
              <div class="product-title">${title}</div>
              <div class="product-category">${category}</div>
            </div>
            <div class="product-price">${formatPrice(product.price)}</div>
          </div>
        </article>
      `;
    }

    function renderProducts() {
      const filtered = activeCategory === "all"
        ? allProducts
        : allProducts.filter(product =>
            String(product.category || "").trim().toLowerCase() === activeCategory
          );

      workCount.textContent = `${filtered.length} ${filtered.length === 1 ? "work" : "works"}`;

      if (!filtered.length) {
        gallery.innerHTML = `
          <div class="state">
            <strong>Nothing here. Yet.</strong>
            <p>The next find might be yours.</p>
          </div>`;
        return;
      }

      gallery.innerHTML = filtered.map(renderProduct).join("");
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        document.querySelectorAll(".filter").forEach(item => {
          item.classList.toggle("active", item === button);
        });
        renderProducts();
      });
    });

    async function loadProducts() {
      if (SUPABASE_KEY === "sb_publishable_vbdPL00ZnIYMrHXQlVAvrg_KupjLMrc") {
        gallery.innerHTML = `
          <div class="state">
            <strong>One tiny setup step.</strong>
            <p>Add your Supabase publishable key in the code to connect the gallery.</p>
          </div>`;
        workCount.textContent = "Setup required";
        return;
      }

      try {
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await db
          .from("products")
          .select("id, title, description, price, image_url, category, stock, is_published, created_at")
          .eq("is_published", true)
          .order("created_at", { ascending: false });

        if (error) throw error;
        allProducts = data || [];
        renderProducts();
      } catch (error) {
        console.error("Supabase error:", error);
        gallery.innerHTML = `
          <div class="state">
            <strong>Can't load the works.</strong>
            <p>Check the Supabase connection and public read policy.</p>
          </div>`;
        workCount.textContent = "Connection issue";
      }
    }

    loadProducts();
  </script>
</body>
</html>
